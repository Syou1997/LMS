<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可預約時段查詢</title>
    <style>
        :root {
            --header: #254b84;
            --bg: #f4f7fb;
            --ink: #223041;
            --muted: #697386;
            --line: #dbe3ef;
            --busy: #e9f3ff;
            --busy-text: #1f5f99;
            --general: #ecfdf5;
            --general-text: #047857;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background: var(--bg);
            font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
        }

        header {
            color: #ffffff;
            background: var(--header);
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 28px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(30px, 5vw, 48px);
            line-height: 1.15;
            letter-spacing: 0;
        }

        .meta {
            display: grid;
            gap: 8px;
            color: rgba(255, 255, 255, .9);
            font-size: clamp(18px, 2.4vw, 24px);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        select {
            min-height: 40px;
            border: 1px solid rgba(255, 255, 255, .36);
            border-radius: 8px;
            font: inherit;
            padding: 8px 10px;
            color: #0f172a;
            background: #ffffff;
        }

        #yearSelect { min-width: 120px; }
        #monthSelect { min-width: 100px; }
        #timezoneSelect { min-width: 230px; }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 28px 28px;
        }

        .calendar {
            overflow-x: auto;
            background: #ffffff;
            border: 1px solid var(--line);
            border-top: 0;
        }

        .weekdays, .calendar-grid {
            min-width: 900px;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .weekday {
            padding: 16px;
            background: #f4f7fb;
            border-right: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            text-align: center;
            font-size: 22px;
            font-weight: 900;
        }

        .weekday:first-child { color: #d64545; }
        .weekday:last-child { color: #2f80ed; border-right: 0; }

        .day {
            min-height: 150px;
            padding: 16px;
            border-right: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            background: #ffffff;
        }

        .day:nth-child(7n) { border-right: 0; }
        .day.empty { background: #f8fafc; }

        .day-num {
            display: block;
            margin-bottom: 14px;
            font-size: 26px;
            font-weight: 900;
        }

        .slot {
            margin-top: 7px;
            padding: 4px 12px;
            border-radius: 8px;
            color: var(--busy-text);
            background: var(--busy);
            font-size: 20px;
            font-weight: 800;
            line-height: 1.25;
        }

        .slot.date-time {
            font-size: 17px;
        }

        .slot.completed {
            color: #697386;
            background: #eef1f4;
        }

        .slot.general {
            color: var(--general-text);
            background: var(--general);
        }

        .slot.teacher {
            color: var(--busy-text);
            background: var(--busy);
        }

        .slot.untimed {
            color: var(--general-text);
            background: var(--general);
        }

        .none {
            color: #a0a7b4;
            font-size: 18px;
            font-weight: 700;
        }

        .footnote {
            padding: 20px 0 0;
            color: var(--muted);
            text-align: center;
            font-size: 18px;
        }

        .data-alert {
            margin: 18px 0;
            padding: 14px 16px;
            border: 1px solid #f59e0b;
            border-radius: 8px;
            color: #7c2d12;
            background: #fff7ed;
            font-size: 17px;
            font-weight: 800;
        }

        .data-alert.hidden { display: none; }

        @media (max-width: 700px) {
            .header-inner { padding: 24px 16px; }
            main { padding: 0 16px 22px; }
            .controls { justify-content: flex-start; }
            #yearSelect, #monthSelect, #timezoneSelect { width: 100%; min-width: 0; }
            .weekdays, .calendar-grid { min-width: 760px; }
        }
    </style>
</head>
<body>
<header>
    <div class="header-inner">
        <div>
            <h1 id="pageTitle">不可預約的時間</h1>
            <div class="meta">
                <div id="timezoneLabel">時區：</div>
                <div id="updatedAt">最後更新：</div>
            </div>
        </div>
        <div class="controls">
            <select id="yearSelect" aria-label="選擇年份"></select>
            <select id="monthSelect"></select>
            <select id="timezoneSelect" aria-label="選擇顯示時區"></select>
        </div>
    </div>
</header>

<main>
    <div id="dataAlert" class="data-alert hidden"></div>
    <section class="calendar" aria-label="不可預約時間月曆">
        <div class="weekdays" id="weekdays"></div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </section>
    <div class="footnote">此頁僅顯示不可預約的時間；其他時段請再與老師確認。</div>
</main>

<script>
    const cacheKey = Date.now();
    const dataScript = document.createElement("script");
    dataScript.src = `./public-schedule-data.js?v=${cacheKey}`;
    dataScript.onload = loadAvailabilityApp;
    dataScript.onerror = () => {
        window.TEACHER_PUBLIC_SCHEDULE = { settings: {}, events: [], loadError: true };
        loadAvailabilityApp();
    };
    document.head.appendChild(dataScript);

    function loadAvailabilityApp() {
        const appScript = document.createElement("script");
        appScript.src = `./availability.js?v=${cacheKey}`;
        document.head.appendChild(appScript);
    }
</script>
</body>
</html>
