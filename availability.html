<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可預約時段查詢</title>
    <style>
        :root {
            --header: #254b84;
            --bg: #f4f7fb;
            --ink: #223041;
            --muted: #697386;
            --line: #dbe3ef;
            --busy: #e9f3ff;
            --busy-text: #1f5f99;
            --general: #ecfdf5;
            --general-text: #047857;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background: var(--bg);
            font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
        }

        header {
            color: #ffffff;
            background: var(--header);
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 28px;
            display: grid;
            grid-template-columns: minmax(280px, 1fr) auto;
            align-items: start;
            gap: 20px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(30px, 5vw, 48px);
            line-height: 1.15;
            letter-spacing: 0;
        }

        .meta {
            display: grid;
            gap: 8px;
            color: rgba(255, 255, 255, .9);
            font-size: clamp(18px, 2.4vw, 24px);
        }

        .announcement-card {
            grid-column: 1 / -1;
            width: 100%;
            margin-top: 8px;
        }

        .announcement-card h3 {
            margin: 0 0 8px;
            color: #ffffff;
            font-size: clamp(20px, 2vw, 26px);
            font-weight: 900;
            line-height: 1.2;
        }

        .announcement-content {
            max-height: 320px;
            overflow-y: auto;
            padding: 12px 14px;
            border: 2px solid #111827;
            border-radius: 8px;
            color: #111827;
            background: #ffffff;
            font-size: clamp(16px, 1.8vw, 20px);
            font-weight: 700;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .controls {
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        .timezone-login-group {
            display: grid;
            gap: 10px;
        }

        select {
            min-height: 40px;
            border: 1px solid rgba(255, 255, 255, .36);
            border-radius: 8px;
            font: inherit;
            padding: 8px 10px;
            color: #0f172a;
            background: #ffffff;
        }

        #yearSelect { min-width: 120px; }
        #monthSelect { min-width: 100px; }
        #timezoneSelect { min-width: 230px; }

        .month-control {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .month-arrow {
            width: 40px;
            min-height: 40px;
            border: 1px solid rgba(255, 255, 255, .36);
            border-radius: 8px;
            color: #0f172a;
            background: #ffffff;
            font: inherit;
            font-weight: 900;
            cursor: pointer;
        }

        .month-arrow:hover {
            background: #eef4ff;
        }

        .student-login {
            width: 100%;
            max-width: 390px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, .22);
            border-radius: 12px;
            background: rgba(255, 255, 255, .12);
            box-shadow: 0 10px 24px rgba(15, 23, 42, .12);
            backdrop-filter: blur(4px);
        }

        .student-login form,
        .student-login-status {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .student-login input {
            min-height: 40px;
            flex: 1 1 190px;
            min-width: 0;
            border: 1px solid rgba(255, 255, 255, .36);
            border-radius: 8px;
            padding: 8px 12px;
            font: inherit;
            color: #0f172a;
            background: #ffffff;
        }

        .student-login button {
            min-height: 40px;
            border: 1px solid rgba(255, 255, 255, .36);
            border-radius: 8px;
            padding: 8px 14px;
            color: #0f172a;
            background: #ffffff;
            font: inherit;
            font-weight: 900;
            cursor: pointer;
        }

        .student-login button:hover {
            background: #eef4ff;
        }

        .student-login-text {
            color: rgba(255, 255, 255, .92);
            font-size: 17px;
            font-weight: 800;
        }

        .student-login-error {
            width: 100%;
            color: #ffe4e6;
            font-size: 15px;
            font-weight: 800;
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 28px 28px;
        }

        .calendar {
            overflow-x: auto;
            background: #ffffff;
            border: 1px solid var(--line);
            border-top: 0;
        }

        .weekdays, .calendar-grid {
            min-width: 900px;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .weekday {
            padding: 16px;
            background: #f4f7fb;
            border-right: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            text-align: center;
            font-size: 22px;
            font-weight: 900;
        }

        .weekday:first-child { color: #d64545; }
        .weekday:last-child { color: #2f80ed; border-right: 0; }

        .day {
            min-height: 150px;
            padding: 16px;
            border-right: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            background: #ffffff;
        }

        .day:nth-child(7n) { border-right: 0; }
        .day.empty { background: #f8fafc; }
        .day.past-day { background: #f8fafc; }
        .day.past-day .day-num,
        .day.past-day .none {
            color: #a0a7b4;
        }
        .day.past-day .slot {
            color: #697386;
            background: #eef1f4;
        }

        .day-num {
            display: block;
            margin-bottom: 14px;
            font-size: 26px;
            font-weight: 900;
        }

        .mobile-weekday {
            display: none;
        }

        .slot {
            margin-top: 7px;
            padding: 4px 12px;
            border-radius: 8px;
            color: var(--busy-text);
            background: var(--busy);
            font-size: 20px;
            font-weight: 800;
            line-height: 1.25;
        }

        .slot.date-time {
            font-size: 17px;
        }

        .slot.completed {
            color: #697386;
            background: #eef1f4;
        }

        .slot.general {
            color: var(--general-text);
            background: var(--general);
        }

        .slot.teacher {
            color: var(--busy-text);
            background: var(--busy);
        }

        .slot.untimed {
            color: var(--general-text);
            background: var(--general);
            white-space: normal;
            overflow-wrap: anywhere;
            line-height: 1.3;
        }

        .none {
            color: #a0a7b4;
            font-size: 18px;
            font-weight: 700;
        }

        .footnote {
            padding: 20px 0 0;
            color: var(--muted);
            text-align: center;
            font-size: 18px;
        }

        .data-alert {
            margin: 18px 0;
            padding: 14px 16px;
            border: 1px solid #f59e0b;
            border-radius: 8px;
            color: #7c2d12;
            background: #fff7ed;
            font-size: 17px;
            font-weight: 800;
        }

        .hidden { display: none !important; }
        .data-alert.hidden { display: none; }

        @media (max-width: 700px) {
            .header-inner {
                grid-template-columns: 1fr;
                padding: 24px 16px;
            }
            main { padding: 0 16px 22px; }
            .controls { justify-content: flex-start; }
            .timezone-login-group { width: 100%; }
            .month-control { width: 100%; }
            .month-control #monthSelect { flex: 1 1 auto; }
            #yearSelect, #monthSelect, #timezoneSelect { width: 100%; min-width: 0; }
            .student-login { max-width: none; }
            .announcement-card {
                margin-top: 0;
            }
            .announcement-content {
                max-height: none;
                font-size: 16px;
            }
            .student-login form,
            .student-login-status { align-items: stretch; }
            .student-login input,
            .student-login button { width: 100%; }
            .calendar {
                overflow-x: visible;
                border-top: 1px solid var(--line);
            }
            .weekdays {
                display: none;
            }
            .calendar-grid {
                min-width: 0;
                display: block;
            }
            .day {
                min-height: 0;
                padding: 14px 16px 16px;
                border-right: 0;
            }
            .day.empty {
                display: none;
            }
            .day-num {
                margin-bottom: 10px;
                font-size: 24px;
            }
            .mobile-weekday {
                display: inline;
                margin-left: 8px;
                color: var(--muted);
                font-size: 16px;
                font-weight: 800;
            }
            .slot {
                width: 100%;
                max-width: 260px;
                font-size: 18px;
            }
            .slot.date-time {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
<header>
    <div class="header-inner">
        <div>
            <h1 id="pageTitle">已排課的時間</h1>
            <div class="meta">
                <div id="timezoneLabel">時區：</div>
                <div id="updatedAt">最後更新：</div>
            </div>
        </div>
        <div class="controls">
            <select id="yearSelect" aria-label="選擇年份"></select>
            <div class="month-control">
                <button type="button" class="month-arrow" id="prevMonthBtn" aria-label="上一個月">‹</button>
                <select id="monthSelect"></select>
                <button type="button" class="month-arrow" id="nextMonthBtn" aria-label="下一個月">›</button>
            </div>
            <div class="timezone-login-group">
                <select id="timezoneSelect" aria-label="選擇顯示時區"></select>
                <div class="student-login" id="studentLoginArea">
                    <form id="studentLoginForm">
                        <input id="studentNameInput" type="text" autocomplete="name" placeholder="輸入學生姓名">
                        <button type="submit">登入</button>
                        <div class="student-login-error hidden" id="studentLoginError"></div>
                    </form>
                    <div class="student-login-status hidden" id="studentLoginStatus">
                        <span class="student-login-text" id="studentLoginText"></span>
                        <button type="button" id="studentLogoutBtn">登出</button>
                    </div>
                </div>
            </div>
        </div>
        <section id="announcement" class="announcement-card hidden" aria-label="最新公告">
            <h3>最新公告：</h3>
            <div id="announcementContent" class="announcement-content"></div>
        </section>
    </div>
</header>

<main>
    <div id="dataAlert" class="data-alert hidden"></div>
    <section class="calendar" aria-label="不可預約時間月曆">
        <div class="weekdays" id="weekdays"></div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </section>
    <div class="footnote">此頁僅顯示已排課的時間；其他時段請再與老師確認。</div>
</main>

<script>
    const cacheKey = Date.now();
    const dataScript = document.createElement("script");
    dataScript.src = `./public-schedule-data.js?v=${cacheKey}`;
    dataScript.onload = loadAvailabilityApp;
    dataScript.onerror = () => {
        window.TEACHER_PUBLIC_SCHEDULE = { settings: {}, events: [], loadError: true };
        loadAvailabilityApp();
    };
    document.head.appendChild(dataScript);

    function loadAvailabilityApp() {
        const appScript = document.createElement("script");
        appScript.src = `./availability.js?v=${cacheKey}`;
        appScript.onerror = () => {
            const alert = document.getElementById("dataAlert");
            if (!alert) return;
            alert.innerText = "找不到 availability.js。請確認這個檔案已放在 availability.html 同一層，並且已推送到 GitHub。";
            alert.classList.remove("hidden");
        };
        document.head.appendChild(appScript);
    }
</script>
</body>
</html>
